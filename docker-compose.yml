# Local development only. Production uses the single image from the Dockerfile.
services:
  db:
    image: postgres:16
    env_file: .env  # POSTGRES_USER / POSTGRES_PASSWORD / POSTGRES_DB
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"  # handy for connecting with a DB GUI or psql from your machine
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 5s
      retries: 15

  api:
    build:
      context: .
      target: dev
    env_file: .env
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app  # your edits appear in the container -> uvicorn --reload restarts
    depends_on:
      db:
        condition: service_healthy

  web:
    image: node:22-alpine
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host"
    environment:
      VITE_API_PROXY: http://api:8000
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules  # keep container's node_modules separate from your machine's
    depends_on:
      - api

volumes:
  pgdata:
